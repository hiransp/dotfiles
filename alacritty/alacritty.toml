[window]
opacity = 0.95
padding = { x = 8, y = 6 }
blur = true
dynamic_padding = true

[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161E"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[env]
TERM = "xterm-256color"

[cursor]
style = "Beam"  # or "Underline" or "Block"
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true

[scrolling]
history = 10000
multiplier = 3

#[[keyboard.bindings]]
#key = "Return"
#mods = "Shift"
#chars = "\x1b\r"
