general {
    hide_cursor = true
    grace = 3
}

background {
    monitor =
    color = rgb(1a1b26)
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    size = 250, 40
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(7aa2f7)
    inner_color = rgb(24283b)
    font_color = rgb(c0caf5)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono NF
    color = rgb(c0caf5)
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(date +"%A, %d %B %Y")"
    font_size = 16
    font_family = JetBrainsMono NF
    color = rgb(a9b1d6)
    position = 0, 50
    halign = center
    valign = center
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
    }
}
