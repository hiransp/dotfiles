################
### MONITORS ###
################

monitor = eDP-1, 1920x1080@60, 0x0, 1
monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1
monitor=,preferred,auto,1

bindl = , switch:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080@60, 0x0, 1"

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = alacritty
$fileManager = thunar
$menu = wofi --show drun

#################
### AUTOSTART ###
#################

# Autostart necessary processes

exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = hyprpaper
exec-once = hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = CTRL, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png && wl-copy < ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################

